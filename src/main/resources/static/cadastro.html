<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Cadastro</title>

  <link rel="stylesheet" href="/style.css">
</head>

<body>

<div class="login-container">

  <div class="login-card">

    <h1>Criar Conta</h1>

    <input
            type="text"
            id="usernameCadastro"
            placeholder="Usuário"
    >

    <input
            type="password"
            id="senhaCadastro"
            placeholder="Senha"
    >

    <button id="btnCadastro">
      Cadastrar
    </button>

    <p class="texto-login">

      Já possui conta?

      <a href="/login.html">
        Fazer login
      </a>

    </p>

  </div>

</div>

<script src="/script.js"></script>

</body>
</html>
